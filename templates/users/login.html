{% extends 'common/base.html' %}
{% load static %}

{% block title %}
Регистрация
{% endblock %}

{% block content %}

{% include 'partials/header.html' %}

<main class="site-content login-page">
    <form class="user-form" action="{% url 'login' %}" method="post">
        {% csrf_token %}
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon icon-lg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25" />
        </svg>
        <h2>Вход в приложението</h2>

        {{ form }}

        <button class="button btn-primary">
            <span>Влез</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon icon-md">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
        </button>
        <p>Нямате акаунт? <a href="{% url 'register' %}">Регистрация</a></p>
    </form>
</main>

{% endblock %}

{% block scripts %}
<script src="{% static 'scripts/scripts.js' %}"></script>
{% endblock %}
