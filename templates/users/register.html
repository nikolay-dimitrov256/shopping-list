{% extends 'common/base.html' %}
{% load static %}

{% block title %}
Регистрация
{% endblock %}

{% block content %}

{% include 'partials/header.html' %}

<main class="site-content register-page">
    <form class="user-form" action="{% url 'register' %}" method="post">
        {% csrf_token %}
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon icon-lg">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 7.5v3m0 0v3m0-3h3m-3 0h-3m-2.25-4.125a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0ZM3 19.235v-.11a6.375 6.375 0 0 1 12.75 0v.109A12.318 12.318 0 0 1 9.374 21c-2.331 0-4.512-.645-6.374-1.766Z" />
        </svg>
        <h2>Създай акаунт</h2>

        {{ form }}

        <button class="button btn-primary">
            <span>Регистрация</span>
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="icon icon-md">
                <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3" />
            </svg>
        </button>
        <p>Вече имате акаунт? <a href="{% url 'login' %}">Вход</a></p>
    </form>
</main>

{% endblock %}

{% block scripts %}
<script src="{% static 'scripts/scripts.js' %}"></script>
{% endblock %}
