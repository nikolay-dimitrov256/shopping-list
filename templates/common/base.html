{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles/styles.css' %}?v=1">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icons/favicon/apple-touch-icon.png' %}">
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'icons/favicon/favicon-32x32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'icons/favicon/favicon-16x16.png' %}">
    <link rel="icon" href="{% static 'icons/favicon/favicon.ico' %}" sizes="any">
    <link rel="manifest" href="{% static 'icons/favicon/site.webmanifest' %}?v=1">
    <title>
        {% block title %}
        {% endblock %}
    </title>
</head>
<body>

    {% block content %}
    {% endblock %}


    {% include 'partials/footer.html' %}

    {% block scripts %}
    {% endblock %}

</body>
</html>
