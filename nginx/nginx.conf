user nginx;
worker_processes auto;

pid /var/run/nginx.pid;
events {
	worker_connections 10;
}

http {
	include mime.types;
	default_type application/octet-stream;

    error_log /var/log/nginx/error.log; # Define the location of the NGINX error log
    access_log /var/log/nginx/access.log;  # Define the location of the NGINX access log

	sendfile on;
	keepalive_timeout 65;

    upstream shopping_list_app {
		server app:8000;
	}

	server {
		listen 80;
		server_name vilistil.me www.vilistil.me;

		return 301 https://$host$request_uri;
	}

	server {
		listen 443 ssl;
		server_name vilistil.me www.vilistil.me;

		ssl_certificate /etc/nginx/certs/origin.pem;
		ssl_certificate_key /etc/nginx/certs/origin.key;

		client_max_body_size 10m;

		location /static/ {
			alias /app/staticfiles/;
			expires 30d;
			add_header Cache-Control "public";
		}

		location / {
			proxy_pass http://shopping_list_app;
			proxy_set_header Host $host;
			proxy_set_header X-Real-IP $remote_addr;
			proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
			proxy_set_header X-Forwarded-Proto $scheme;
		}
	}
}
